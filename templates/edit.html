{% extends "base.html" %}

{% block content %}

<h2>Edit Student</h2>

<form action="/update/{{ student._id }}" method="POST">

<input
type="text"
name="name"
value="{{ student.name }}"
class="form-control mb-3">

<input
type="email"
name="email"
value="{{ student.email }}"
class="form-control mb-3">

<button class="btn btn-primary">

Update

</button>

<a href="/" class="btn btn-secondary">

Back

</a>

</form>

{% endblock %}
